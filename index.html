<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUSTRE — Virtual Jewellery Try-On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --ivory:#FAF6EF;
  --cream:#F1E9DB;
  --card:#FFFFFF;
  --charcoal:#2B2620;
  --charcoal-soft:#5B5348;
  --gold:#A9814C;
  --gold-deep:#8B6A3D;
  --gold-pale:#E7D8B8;
  --wine:#6E2A3B;
  --line:#E6DCC7;
  --shadow: 0 12px 32px rgba(43,38,32,0.08);
  --radius: 2px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ivory);
  color:var(--charcoal);
  font-family:'Manrope',sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  margin:0;
  color:var(--charcoal);
}
p{margin:0;}
button{font-family:'Manrope',sans-serif;cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
.app{min-height:100vh;display:flex;flex-direction:column;}
::selection{background:var(--gold-pale);}

/* ---------- Header ---------- */
.site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 40px;border-bottom:1px solid var(--line);
  background:var(--ivory);position:sticky;top:0;z-index:50;
}
.brand{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:4px;font-weight:600;cursor:pointer;}
.brand span{color:var(--gold);}
.nav-links{display:flex;gap:32px;align-items:center;}
.nav-links a{color:var(--charcoal-soft);font-size:14px;text-decoration:none;cursor:pointer;transition:color .2s;}
.nav-links a:hover{color:var(--gold-deep);}
.nav-links a.active{color:var(--charcoal);border-bottom:1px solid var(--gold);padding-bottom:4px;}
.header-actions{display:flex;align-items:center;gap:20px;}
.icon-btn{position:relative;font-size:19px;color:var(--charcoal);}
.cart-count{
  position:absolute;top:-8px;right:-10px;background:var(--wine);color:#fff;
  font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.mobile-menu-btn{display:none;font-size:20px;}

/* ---------- Buttons ---------- */
.btn{
  padding:14px 30px;font-size:14px;letter-spacing:.5px;border-radius:var(--radius);
  transition:all .25s ease;display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn-primary{background:var(--charcoal);color:var(--ivory);}
.btn-primary:hover{background:var(--gold-deep);}
.btn-outline{border:1px solid var(--charcoal);color:var(--charcoal);}
.btn-outline:hover{border-color:var(--gold-deep);color:var(--gold-deep);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:var(--gold-deep);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{padding:9px 16px;font-size:12.5px;}
.btn-full{width:100%;}

/* ---------- Landing ---------- */
.badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border:1px solid var(--gold-pale);
  border-radius:20px;font-size:12.5px;letter-spacing:.5px;color:var(--gold-deep);background:#fffdf8;
}
.hero{
  display:grid;grid-template-columns:1.05fr 0.95fr;gap:60px;align-items:center;
  padding:70px 40px 90px;max-width:1280px;margin:0 auto;
}
.hero-heading{font-size:56px;line-height:1.08;max-width:560px;}
.hero-sub{margin-top:22px;font-size:17px;color:var(--charcoal-soft);max-width:460px;line-height:1.65;}
.hero-actions{margin-top:34px;display:flex;gap:16px;flex-wrap:wrap;}
.hero-badge-row{margin-bottom:24px;}
.hero-visual{position:relative;display:flex;align-items:center;justify-content:center;}
.hero-photo-frame{
  position:relative;width:340px;border-radius:6px;overflow:hidden;box-shadow:var(--shadow);
  border:8px solid #fff;
}
.hero-photo-frame img{width:100%;display:block;}
.hero-float-card{
  position:absolute;background:#fff;padding:10px 14px;border-radius:6px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;font-size:12.5px;
}
.hero-float-card img{width:34px;height:34px;object-fit:contain;}
.hero-float-1{top:14%;left:-13%;}
.hero-float-2{bottom:10%;right:-14%;}
.hero-plus{position:absolute;font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold);}
.hero-plus.p1{top:34%;left:-6%;}
.hero-plus.p2{bottom:26%;right:-6%;}

.section-label{
  font-size:13px;letter-spacing:2px;color:var(--gold-deep);text-transform:uppercase;margin-bottom:14px;
}
.how-it-works{padding:80px 40px;max-width:1200px;margin:0 auto;}
.how-heading{max-width:560px;margin-bottom:50px;}
.how-heading h2{font-size:38px;}
.steps-row{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;}
.step-card{padding:30px 26px;background:var(--card);border:1px solid var(--line);border-radius:4px;}
.step-num{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--gold);letter-spacing:2px;margin-bottom:18px;}
.step-card h3{font-size:24px;margin-bottom:10px;}
.step-card p{color:var(--charcoal-soft);font-size:14.5px;}

.cta-band{
  margin:0 40px 90px;max-width:1200px;margin-left:auto;margin-right:auto;
  background:var(--charcoal);color:var(--ivory);border-radius:6px;
  padding:56px 60px;display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;
}
.cta-band h3{color:var(--ivory);font-size:30px;max-width:440px;}
.cta-band .btn-primary{background:var(--gold);}
.cta-band .btn-primary:hover{background:var(--gold-pale);color:var(--charcoal);}

.site-footer{padding:30px 40px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--charcoal-soft);}

/* ---------- Upload screen ---------- */
.upload-screen{max-width:720px;margin:0 auto;padding:70px 24px 100px;text-align:center;}
.upload-screen h2{font-size:36px;margin-bottom:12px;}
.upload-screen>p{color:var(--charcoal-soft);margin-bottom:44px;}
.dropzone{
  border:1.5px dashed var(--gold-pale);border-radius:8px;padding:60px 30px;background:#fffdf9;
  transition:border-color .2s,background .2s;cursor:pointer;
}
.dropzone:hover,.dropzone.drag{border-color:var(--gold);background:#fbf4e6;}
.dropzone .icon{font-size:34px;margin-bottom:14px;}
.dropzone h4{font-size:19px;margin-bottom:6px;}
.dropzone p{color:var(--charcoal-soft);font-size:14px;}
.upload-divider{display:flex;align-items:center;gap:16px;margin:34px 0;color:var(--charcoal-soft);font-size:13px;}
.upload-divider::before,.upload-divider::after{content:'';flex:1;height:1px;background:var(--line);}
.upload-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
#fileInput{display:none;}
.demo-photo-preview{margin-top:30px;}
.demo-photo-preview img{width:180px;border-radius:6px;margin:0 auto 10px;box-shadow:var(--shadow);}

/* ---------- Studio ---------- */
.studio{
  display:grid;grid-template-columns:230px 1fr;gap:0;max-width:1400px;margin:0 auto;width:100%;flex:1;
}
.categories-panel{padding:30px 22px;border-right:1px solid var(--line);}
.categories-panel h4{font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--charcoal-soft);margin-bottom:18px;}
.cat-btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:5px;
  font-size:14.5px;color:var(--charcoal-soft);margin-bottom:4px;transition:background .2s,color .2s;
}
.cat-btn .cat-emoji{font-size:17px;}
.cat-btn:hover{background:var(--cream);}
.cat-btn.active{background:var(--charcoal);color:#fff;}
.studio-right{display:flex;flex-direction:column;}
.studio-main{display:grid;grid-template-columns:1fr 300px;gap:30px;padding:30px 34px 10px;}

.photo-stage{
  position:relative;border-radius:8px;overflow:hidden;background:#efe7d8;
  box-shadow:var(--shadow);
}
.photo-stage img.base-photo{width:100%;height:auto;display:block;}
.overlay-item{
  position:absolute;pointer-events:auto;cursor:grab;touch-action:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));
  animation:pop-in .3s ease;will-change:transform;
}
.overlay-item.selected{outline:1px dashed rgba(169,129,76,.9);outline-offset:3px;}
.overlay-item img{width:100%;display:block;}
@keyframes pop-in{from{opacity:0;}to{opacity:1;}}
.overlay-item.dragging{cursor:grabbing;}
.overlay-item img{pointer-events:none;-webkit-user-drag:none;}
.calib-layer{position:absolute;inset:0;cursor:crosshair;background:rgba(43,38,32,.28);}
.calib-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#fff;
  padding:8px 16px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap;}
.calib-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);
  border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.3);}
.fit-status{font-size:12px;color:var(--charcoal-soft);margin-top:10px;display:flex;align-items:center;gap:8px;}
.fit-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
.fit-dot.ok{background:#4C8B5B;}
.fit-dot.warn{background:#C08A3E;}
.empty-stage-msg{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px;background:rgba(250,246,239,0.0);
}
.empty-stage-msg h4{font-size:19px;margin-bottom:8px;color:var(--charcoal);background:rgba(255,255,255,.82);padding:6px 16px;border-radius:20px;}
.empty-stage-msg p{font-size:13px;color:var(--charcoal-soft);background:rgba(255,255,255,.82);padding:4px 14px;border-radius:20px;margin-top:6px;}
.hand-chip{
  position:absolute;background:rgba(255,255,255,.94);border-radius:8px;padding:6px 10px 6px 6px;
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.15);pointer-events:none;
  animation:pop-in .35s ease;
}
.hand-chip img{width:38px;height:38px;object-fit:contain;}
.hand-chip span{font-size:11px;color:var(--charcoal-soft);max-width:80px;line-height:1.3;}

.photo-controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.ctrl-btn{
  font-size:12.5px;color:var(--charcoal-soft);border:1px solid var(--line);padding:8px 14px;border-radius:20px;
  display:flex;align-items:center;gap:6px;background:#fff;transition:.2s;
}
.ctrl-btn:hover{border-color:var(--gold);color:var(--gold-deep);}

.mylook-panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;height:fit-content;}
.mylook-panel h4{font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--charcoal-soft);margin-bottom:16px;}
.mylook-empty{font-size:13.5px;color:var(--charcoal-soft);padding:18px 0;text-align:center;}
.mylook-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;}
.mylook-item img{width:46px;height:46px;object-fit:cover;border-radius:4px;background:#f4efe4;}
.mylook-item-info{flex:1;}
.mylook-item-info p.name{font-size:13.5px;margin-bottom:2px;}
.mylook-item-info p.price{font-size:13px;color:var(--gold-deep);}
.remove-link{font-size:11.5px;color:var(--charcoal-soft);text-decoration:underline;margin-top:3px;cursor:pointer;}
.mylook-total{display:flex;justify-content:space-between;padding:16px 0;font-size:15px;}
.mylook-total span:last-child{font-family:'Cormorant Garamond',serif;font-size:20px;}

.catalogue-section{padding:36px 34px 70px;}
.catalogue-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
.catalogue-head h3{font-size:24px;}
.catalogue-head span{font-size:13px;color:var(--charcoal-soft);}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;}
.product-card{
  background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;
  transition:box-shadow .25s, transform .25s;position:relative;
}
.product-card:hover{box-shadow:var(--shadow);transform:translateY(-3px);}
.product-card.selected{border-color:var(--gold);}
.product-img-wrap{aspect-ratio:1/1.08;background:#f6f1e6;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.product-img-wrap img{width:100%;height:100%;object-fit:contain;padding:14px;}
.popular-badge{
  position:absolute;top:10px;left:10px;background:var(--wine);color:#fff;font-size:10.5px;letter-spacing:.5px;
  padding:4px 9px;border-radius:12px;
}
.product-info{padding:16px;}
.product-info h4{font-size:16px;font-weight:500;margin-bottom:4px;}
.product-info .cat-tag{font-size:11.5px;color:var(--charcoal-soft);text-transform:capitalize;margin-bottom:8px;}
.product-info .price{font-size:16px;color:var(--gold-deep);font-family:'Cormorant Garamond',serif;font-weight:600;margin-bottom:12px;}
.product-actions{display:flex;gap:8px;}
.tryon-btn{flex:1;}
.tryon-btn.added{background:var(--gold-pale);color:var(--gold-deep);}
.add-cart-btn{width:38px;border:1px solid var(--line);border-radius:5px;font-size:15px;display:flex;align-items:center;justify-content:center;}
.add-cart-btn:hover{border-color:var(--gold);}
.empty-category{padding:60px 20px;text-align:center;color:var(--charcoal-soft);}
.empty-category .icon{font-size:32px;margin-bottom:12px;}

/* ---------- Cart / Checkout / Success ---------- */
.page-narrow{max-width:760px;margin:0 auto;padding:60px 24px 100px;width:100%;}
.page-narrow h2{font-size:32px;margin-bottom:30px;}
.cart-row{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center;}
.cart-row img{width:74px;height:74px;object-fit:cover;border-radius:5px;background:#f4efe4;}
.cart-row .info{flex:1;}
.cart-row .info h4{font-size:16px;margin-bottom:4px;font-weight:500;}
.cart-row .info p{font-size:13px;color:var(--charcoal-soft);text-transform:capitalize;}
.cart-row .price{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--gold-deep);}
.cart-summary{margin-top:30px;padding-top:20px;border-top:1px solid var(--charcoal);}
.summary-line{display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px;}
.summary-line.total{font-family:'Cormorant Garamond',serif;font-size:24px;margin-top:14px;}
.empty-cart{text-align:center;padding:70px 20px;color:var(--charcoal-soft);}
.empty-cart .icon{font-size:38px;margin-bottom:16px;}

.checkout-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-group{margin-bottom:16px;}
.form-group.full{grid-column:1/-1;}
.form-group label{display:block;font-size:12.5px;color:var(--charcoal-soft);margin-bottom:6px;}
.form-group input{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:4px;font-size:14px;
  font-family:'Manrope',sans-serif;background:#fff;
}
.form-group input:focus{outline:none;border-color:var(--gold);}
.order-summary-box{background:var(--cream);border-radius:6px;padding:22px;margin:30px 0;}
.order-summary-box h4{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--charcoal-soft);margin-bottom:14px;}
.order-line{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;}
.order-line.total{margin-top:12px;padding-top:12px;border-top:1px solid var(--gold-pale);font-weight:600;}

.success-screen{max-width:520px;margin:80px auto;text-align:center;padding:0 24px;}
.success-icon{font-size:48px;margin-bottom:20px;}
.success-screen h2{font-size:34px;margin-bottom:12px;}
.success-screen>p{color:var(--charcoal-soft);margin-bottom:36px;}
.success-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

/* ---------- Mobile sticky look bar ---------- */
.mobile-look-bar{
  display:none;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:12px 16px;align-items:center;justify-content:space-between;box-shadow:0 -6px 18px rgba(0,0,0,.06);z-index:40;
}
.mobile-look-bar .info{font-size:13px;}
.mobile-look-bar .info b{font-family:'Cormorant Garamond',serif;font-size:18px;display:block;}

@media (max-width:900px){
  .site-header{padding:16px 20px;}
  .nav-links{display:none;}
  .hero{grid-template-columns:1fr;padding:40px 20px 60px;text-align:center;}
  .hero-sub{margin-left:auto;margin-right:auto;}
  .hero-actions{justify-content:center;}
  .hero-heading{font-size:38px;margin:0 auto;}
  .hero-visual{margin-top:30px;}
  .hero-float-1,.hero-float-2{display:none;}
  .steps-row{grid-template-columns:1fr;}
  .cta-band{flex-direction:column;text-align:center;padding:40px 26px;}
  .studio{grid-template-columns:1fr;}
  .categories-panel{
    border-right:none;border-bottom:1px solid var(--line);padding:16px 16px;
    display:flex;gap:8px;overflow-x:auto;
  }
  .categories-panel h4{display:none;}
  .cat-btn{white-space:nowrap;margin-bottom:0;}
  .studio-main{grid-template-columns:1fr;padding:20px 16px 0;}
  .mylook-panel{display:none;}
  .mobile-look-bar{display:flex;}
  .catalogue-section{padding:24px 16px 90px;}
  .product-grid{grid-template-columns:repeat(2,1fr);gap:14px;}
  .checkout-grid{grid-template-columns:1fr;}
}

.stage-wrap{position:relative;}
.detect-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(250,246,239,.72);backdrop-filter:blur(2px);flex-direction:column;gap:10px;z-index:5;}
.spinner{width:26px;height:26px;border:2px solid var(--gold-pale);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.detect-overlay p{font-size:13px;color:var(--charcoal-soft);}
.anchor-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;
  border-radius:12px;background:var(--cream);color:var(--charcoal-soft);}
.anchor-pill.on{background:#E4EFE6;color:#356B43;}
.anchor-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.adjust-bar{display:flex;gap:8px;align-items:center;margin-top:12px;padding:10px 12px;
  background:#fff;border:1px solid var(--line);border-radius:6px;flex-wrap:wrap;}
.adjust-bar .lbl{font-size:12px;color:var(--charcoal-soft);}
.adjust-bar input[type=range]{width:92px;accent-color:var(--gold);}
.adjust-bar input[type=range]::-webkit-slider-thumb{appearance:none;width:0;height:0;}
.adjust-bar input[type=range]::-moz-range-thumb{width:0;height:0;border:none;}
.warn-box{background:#FDF4E3;border:1px solid var(--gold-pale);border-radius:6px;padding:12px 14px;
  font-size:13px;color:var(--charcoal-soft);margin-top:12px;}

</style>
</head>
<body>
<div id="app" class="app"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
